  - id: slack
    label: Slack
    style: slack
    question: How to filter from table?
    mention: "@Data8 Tutor"
    botName: Data8 Tutor
    answer: |
      To filter rows from a table, you'll typically use the `where` method. This allows you to specify a condition based on a column's values.

      Here's a general process to follow:
      1. **Identify the table** you want to filter.
      2. **Choose the column** you want to filter by.
      3. **Define the condition** for filtering (e.g., greater than a certain value, equal to a specific value, etc.).
      4. **Use the `where` method** to apply the filter.

  - id: grok
    label: Grok Bot
    style: grok
    question: How can I filter a table
    botName: Data 8 Tutor
    answer: |
      You filter a table with `tbl.where(column, condition)`. It keeps only the rows where that column meets the condition, like `are.above(10)` or `are.equal_to('PG')`. If you leave out `are` and just pass a value, it matches that value exactly.

      What are you trying to filter? Tell me the table, the column, and what you want to keep, and I'll point you to the next step. Textbook 6.2 (Selecting Rows) lists every `are` option.
